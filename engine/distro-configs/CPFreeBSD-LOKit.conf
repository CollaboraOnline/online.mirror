# Engine configure switches for the Collabora Online build on FreeBSD
# (./autogen.sh --with-distro=CPFreeBSD-LOKit). Based on CPLinux-LOKit
# but uses system libraries where the internal build fails on FreeBSD.
# The language list comes from Langs.conf via the INCLUDE below.

# pull in shared config
INCLUDE:CPLinuxCommon
INCLUDE:Langs

# enable features for Online release build
--enable-noto-font
--enable-sal-log
--with-external-dict-dir=/usr/local/share/hunspell
--with-external-hyph-dir=/usr/local/share/hyphen
--with-external-thes-dir=/usr/local/share/mythes

# FreeBSD host tools
--with-gnu-patch=/usr/local/bin/gpatch

# use internal libraries, same as CPLinux-LOKit
--without-system-curl
--without-system-expat
--without-system-graphite
--without-system-harfbuzz
--without-system-jars
--without-system-libpng

# use system libraries: internal build fails on FreeBSD
# icu: genrb/genbrk cannot find data at runtime
--with-system-icu
# python: internal python3 build fails
--enable-python=system
# redland: internal raptor fails to compile against FreeBSD headers
--with-system-redland
# cairo: internal meson cannot find internal pixman/fontconfig
--with-system-cairo
--with-system-fontconfig
--with-system-freetype

# not needed for COOL server
--disable-coinmp
--disable-epm
--without-package-format
