<main>
  <div class="container" style="max-width:none;">
    <script>Admin.Flamegraph(host);</script>

    <!-- Every control is on one wrapping row, and the picture gets the rest of the window. -->
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:4px;">
      <h3 class="title is-5" style="margin:0 6px 0 0;"><script>document.write(l10nstrings.strFlamegraph)</script></h3>

      <label for="profile-document"><script>document.write(l10nstrings.strProfilePickDocument)</script></label>
      <select class="select" id="profile-document"></select>
      <button type="button" class="button is-info is-small" id="profile-start" style="min-width:70px;"><script>document.write(l10nstrings.strProfileStart)</script></button>
      <button type="button" class="button is-info is-small" id="profile-stop" style="min-width:70px;" disabled><script>document.write(l10nstrings.strProfileStop)</script></button>

      <label for="profile-rate"><script>document.write(l10nstrings.strProfileRate)</script></label>
      <select class="select" id="profile-rate">
        <option value="100" selected>10</option>
        <option value="50">20</option>
        <option value="20">50</option>
      </select>

      <label for="profile-thread"><script>document.write(l10nstrings.strProfileThread)</script></label>
      <select class="select" id="profile-thread">
        <option value=""><script>document.write(l10nstrings.strProfileAllThreads)</script></option>
      </select>

      <label for="profile-search"><script>document.write(l10nstrings.strProfileSearch)</script></label>
      <input class="input" type="text" id="profile-search" style="min-width:140px;width:140px;">
      <span id="profile-matched" class="has-text-grey"></span>

      <button type="button" class="button is-small" id="profile-freeze"><script>document.write(l10nstrings.strProfileFreeze)</script></button>
      <button type="button" class="button is-small" id="profile-reset"><script>document.write(l10nstrings.strProfileReset)</script></button>
      <button type="button" class="button is-small" id="profile-zoom-reset"><script>document.write(l10nstrings.strProfileResetZoom)</script></button>
      <button type="button" class="button is-small" id="profile-fit" style="min-width:110px;"><script>document.write(l10nstrings.strProfileFitWindow)</script></button>
      <button type="button" class="button is-small" id="profile-download-folded"><script>document.write(l10nstrings.strProfileDownloadFolded)</script></button>
      <button type="button" class="button is-small" id="profile-download-svg"><script>document.write(l10nstrings.strProfileDownloadSvg)</script></button>
    </div>

    <p id="profile-status" class="has-text-grey" style="margin:0;font-size:0.85rem;"></p>
    <p id="profile-detail" style="margin:0;min-height:1.4em;font-family:monospace;font-size:0.85rem;word-break:break-all;"></p>

    <div id="profile-graph" style="width:100%;height:calc(100vh - 220px);min-height:300px;overflow:auto;background-color:#FFFFFF;">
      <svg id="profile-svg" width="100%" height="0"></svg>
    </div>
  </div>
</main>

<script>
  document.getElementById('a-flamegraph-mobile').classList.add('is-active');
  document.getElementById('a-flamegraph-tablet').classList.add('is-active');
  document.getElementById('button-admin-panel-collapse').click();
</script>
