<!-- when cypress is enabled this html will be copied to dist folder to use it for multiuser tests -->
<html style="height:100%"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>Multiuser tests</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">
</head>
<body>
    <form id="form1" action enctype="multipart/form-data" target="iframe1" method="post">
        <input name="access_token" value="test" type="hidden"/>
   </form>

    <form id="form2" action enctype="multipart/form-data" target="iframe2" method="post">
        <input name="access_token" value="test" type="hidden"/>
    </form>

    <form id="form3" action enctype="multipart/form-data" target="iframe3" method="post">
        <input name="access_token" value="test" type="hidden"/>
    </form>

    <iframe id="iframe1" name="iframe1" frameborder="0" scrolling="yes" style="height: 100%;
            width: 49%; float: left; " height="100%" width="49%" align="left">
    </iframe>

    <iframe id="iframe2" name="iframe2" frameborder="0" scrolling="yes" style="overflow: hidden; height: 100%;
                width: 49%; " height="100%" width="49%" align="right">
    </iframe>

    <iframe id="iframe3" name="iframe3" frameborder="0" scrolling="yes" style="display: none;
                overflow: hidden; height: 100%; width: 32%; " height="100%" width="32%" align="right">
    </iframe>
    <script>
        // filePathParam: 'file_path' (iframe1), 'file_path2' (iframe2) or
        // 'file_path3' (iframe3). When the numbered one is missing, the iframe
        // falls back to file_path so existing single-file multiuser tests keep
        // working.
        // useridParam: 'userid1' (iframe1), 'userid2' (iframe2) or 'userid3'
        // (iframe3). Most multiuser tests pass none of them, so the iframes fall
        // back to the two shared debug users, which have no settings store of
        // their own and start from the same state every run. Tests that need
        // distinct, persisting users (e.g. theme isolation) pass explicit ids;
        // the test WOPI server then gives each its own settings store. The same
        // id in two iframes is one user with two connections.
        function constructWopiUrl(filePathParam, useridParam, defaultUserid) {
            var wopiUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + "?";
            wopiUrl = wopiUrl.replace("cypress-multiuser.html", "cool.html");
            var params = new URLSearchParams(window.location.search);
            var filePath = params.get(filePathParam);
            if (filePath === null)
                filePath = params.get('file_path');
            filePath = filePath.substr(1);
            params.delete('file_path');
            params.delete('file_path2');
            params.delete('file_path3');
            var userid = params.get(useridParam) || defaultUserid;
            params.delete('userid');
            params.delete('userid1');
            params.delete('userid2');
            params.delete('userid3');
            var wopiSrc = window.location.protocol + "//" + window.location.host + "/wopi/files/" + encodeURIComponent(filePath);
            wopiUrl = wopiUrl + "WOPISrc=" + wopiSrc + '&' + params.toString();
            if (userid)
                wopiUrl += '&userid=' + userid;
            return { url: wopiUrl, userid: userid };
        }
       // The access token is an auth credential, not an identity (the test WOPI
       // server resolves the user from &userid). Vary it per user so the
       // proactive vetting key (docKey_token) differs between the two iframes
       // and a concurrent load cannot pick up the other user's vetting result.
       function applyForm(form, filePathParam, useridParam, defaultUserid) {
           var built = constructWopiUrl(filePathParam, useridParam, defaultUserid);
           form.action = built.url;
           if (built.userid)
               form.querySelector('input[name=access_token]').value = 'test-' + built.userid;
       }
       var form1 = document.getElementById("form1");
       applyForm(form1, 'file_path', 'userid1', 'test');
       form1.submit();

       var form2 = document.getElementById("form2");
       applyForm(form2, 'file_path2', 'userid2', 'test2');

       // A third view is optional and a test asks for it with &userid3, for
       // example to give one user two connections. The three frames then share
       // the width.
       var form3 = document.getElementById("form3");
       var thirdView = new URLSearchParams(window.location.search).has('userid3');

       if (thirdView) {
           applyForm(form3, 'file_path3', 'userid3');
           ['iframe1', 'iframe2', 'iframe3'].forEach(function(id) {
               var frame = document.getElementById(id);
               frame.style.display = 'block';
               frame.style.width = '32%';
               frame.style.float = 'left';
               frame.setAttribute('width', '32%');
           });
       }

        window.addEventListener(
            'message',
            (event) => {
                if (event.origin !== window.origin)
                    return;

                // check if event is an error message
                if (typeof event.data === 'object' &&
                    event.data !== null &&
                    typeof event.data.name === 'string' &&
                    event.data.name.endsWith("Error"))
                    throw event.data;

                var msg;
                try {
                    msg = JSON.parse(event.data);
                    if (!msg)
                        return;
                } catch(e) {
                    return;
                }

                switch (msg.MessageId) {
                    case 'App_LoadingStatus':
                        if (!msg.Values)
                            return;
                        // Load the frames one after the other, so the views join in
                        // the order of their numbers and iframe1 is the first view.
                        if (msg.Values.Status !== 'Frame_Ready')
                            break;
                        if (event.source === document.getElementById('iframe1').contentWindow)
                            form2.submit();
                        else if (thirdView
                            && event.source === document.getElementById('iframe2').contentWindow)
                            form3.submit();
                        break;
                }
            }
        );
    </script>
</body>
</html>
